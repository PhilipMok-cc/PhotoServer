<html>
<head>
    <title>{{.AlbumName}} Pages</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    {{range .Chapters}}
    <div id="chapter-{{.ID}}" class="chapter no-border" data-chapter-name="{{.ID}}">
        {{range .Images}}
        <div class="image-container">
            <img src="/photos/{{$.AlbumName}}/{{.FileName}}" alt="{{.FileName}}">
        </div>
        {{end}}
    </div>
    {{end}}
    <!-- Fixed Bottom Index Display -->
    <div id="indexDisplay" class="index-display">Chapter: {{(index .Chapters 0).ID}}, Image 1 of {{.TotalImages}}</div>

    <script src="/static/js/script.js"></script>
</body>
</html>
